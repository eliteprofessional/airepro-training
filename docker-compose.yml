services:
  support-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: airepro-support-backend:latest
    container_name: airepro-support-backend
    ports:
      - "${BACKEND_PORT:-1410}:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      SERVE_FRONTEND: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://support.airepro.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-change-me-to-a-long-random-string}
    volumes:
      - support-content:/app/public/support
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  support-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://support-s.airepro.in}
    image: airepro-support-frontend:latest
    container_name: airepro-support-frontend
    ports:
      - "${FRONTEND_PORT:-409}:80"
    depends_on:
      support-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  support-content:
