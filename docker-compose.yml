services:
  airepro-support:
    build:
      context: .
      dockerfile: Dockerfile
    image: airepro-support:latest
    container_name: airepro-support
    ports:
      - "${PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-change-me-to-a-long-random-string}
    volumes:
      # Persist admin-edited markdown + catalog across restarts
      - support-content:/app/public/support
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  support-content:
