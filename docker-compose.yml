services:
  training-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: airepro-training-backend:latest
    container_name: airepro-training-backend
    ports:
      - "${BACKEND_PORT:-1411}:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      HOST: 0.0.0.0
      SERVE_FRONTEND: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://training.airepro.in}
      AUTH_MODE: ${AUTH_MODE:-obo}
      OBO_API_BASE_URL: ${OBO_API_BASE_URL:-}
      TRAINING_JWT_SECRET: ${TRAINING_JWT_SECRET:-${ADMIN_TOKEN_SECRET:-change-me-to-a-long-random-string}}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-change-me-to-a-long-random-string}
      TRAINING_DB_PATH: /app/data/training.sqlite
    volumes:
      - training-content:/app/public/training
      - training-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  training-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://training-s.airepro.in}
    image: airepro-training-frontend:latest
    container_name: airepro-training-frontend
    ports:
      - "${FRONTEND_PORT:-410}:80"
    depends_on:
      training-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  training-content:
  training-data:
